<!DOCTYPE html><html>
<head>
    <title>Interactive Contact Form</title>
</head><body><!-- Header Section -->
<div id="header">
    <h1>Contact Us</h1>
    <span>We would love to hear from you!</span>
</div>

<hr>

<!-- Content Section -->
<div id="content">

    <h2>Contact Form</h2>

    <form>

        Email:
        <input type="email" name="email">
        <br><br>

        Preferred Contact Date:
        <input type="date" name="date">
        <br><br>

        Satisfaction Level:
        <input type="range" name="satisfaction" min="0" max="10">
        <br><br>

        <input type="submit" value="Submit">

    </form>

    <hr>

    <h2>Inline Calculator</h2>

    <input type="number" id="num1" placeholder="Enter first number">

    +

    <input type="number" id="num2" placeholder="Enter second number">

    =

    <output id="result">0</output>

</div>

<hr>

<!-- Footer Section -->
<div id="footer">

    <p>Contact:
         <a href="mailto:Irayaya@gmail.com">
            Irayaya@gmail.com
         </a> 
        </p>

    <p>&copy; 2026 Contact Us. All Rights Reserved.</p>

</div>

<!-- JavaScript for Calculator -->
<script>

    var num1 = document.getElementById("num1");
    var num2 = document.getElementById("num2");
    var result = document.getElementById("result");

    function calculate() {

        var number1 = Number(num1.value);
        var number2 = Number(num2.value);

        result.value = number1 + number2;

    }

    num1.addEventListener("input", calculate);
    num2.addEventListener("input", calculate);

</script>

</body>
</html>
