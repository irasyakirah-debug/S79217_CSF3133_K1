
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock, Paper, Scissors</title>

    <!-- Link to CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header section -->
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name, then play Rock, Paper or Scissors.</p>
    </header>

    <!-- Player name section -->
    <section>
        <label for="playerName">Your Name:</label>
        <input type="text" id="playerName" placeholder="Enter your name">

        <button onclick="startGame()">Start Game</button>

        <p id="welcome"></p>
    </section>

    <!-- Game section -->
    <section id="game">

        <h2>Choose Your Move</h2>

        <button onclick="playRound('rock')">Rock</button>
        <button onclick="playRound('paper')">Paper</button>
        <button onclick="playRound('scissors')">Scissors</button>

        <!-- Display player and computer images -->
        <div class="choices">

            <div>
                <h3>You</h3>
                <img id="playerImg" src="rock.png" alt="Player choice">
            </div>

            <div>
                <h3>Computer</h3>
                <img id="computerImg" src="rock.png" alt="Computer choice">
            </div>

        </div>

        <!-- Display round result -->
        <p id="result"></p>

    </section>

    <!-- Scoreboard -->
    <section>

        <h3>Scoreboard</h3>

        <p>
            Wins: <span id="wins">0</span>
            Losses: <span id="losses">0</span>
            Draws: <span id="draws">0</span>
        </p>

    </section>

    <!-- Game history -->
    <section>

        <h2>History</h2>

        <table id="history">

            <tr>
                <th>Round</th>
                <th>You</th>
                <th>Computer</th>
                <th>Result</th>
            </tr>

        </table>

        <button onclick="showSummary()">Show Summary</button>
        <button onclick="resetGame()">Reset</button>

        <p id="summary"></p>

    </section>

    <!-- Footer -->
    <footer>
        <p id="startTime"></p>
        <p>&copy; Computer Science Club</p>
    </footer>

    <!-- Link to JavaScript file -->
    <script src="game.js"></script>

</body>
</html>
